[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/renanravelli/islet"

[workspace.dependencies]
islet-core = { path = "crates/core" }
islet-protocol = { path = "crates/protocol" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = "1.54.1"
ts-rs = "12.0.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# Keep in sync with apps/desktop/src-tauri/Cargo.toml, which declares its own lints.
undocumented_unsafe_blocks = "deny"

[profile.release]
lto = true
codegen-units = 1
strip = true
