name: Update manifest

# Publishing a release offers it to installed apps: this writes latest.json, which the in-app
# updater reads (ADR 0006), to the `updater` branch. Drafts are never offered. Run it by hand
# to offer a published release again.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: The published release to offer, such as v0.1.1
        required: true

permissions:
  contents: write

concurrency:
  group: update-manifest
  cancel-in-progress: false

jobs:
  manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Write latest.json
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          release="$(gh release view "$TAG" --json isDraft,publishedAt,url)"
          if [[ "$(jq -r .isDraft <<<"$release")" == true ]]; then
            echo "::error::$TAG is still a draft"; exit 1
          fi
          version="${TAG#v}"
          bundle="Islet_${version}_universal.app.tar.gz"
          gh release download "$TAG" --pattern "$bundle.sig" --dir "$RUNNER_TEMP"
          # One universal bundle serves both architectures.
          jq -n \
            --arg version "$version" \
            --arg notes "$(jq -r .url <<<"$release")" \
            --arg date "$(jq -r .publishedAt <<<"$release")" \
            --arg url "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$bundle" \
            --rawfile signature "$RUNNER_TEMP/$bundle.sig" \
            '{version: $version, notes: $notes, pub_date: $date, platforms: {
              "darwin-aarch64": {signature: $signature, url: $url},
              "darwin-x86_64": {signature: $signature, url: $url}}}' \
            > "$RUNNER_TEMP/latest.json"
          cat "$RUNNER_TEMP/latest.json"

      - name: Publish it on the updater branch
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch --depth 1 origin updater:refs/remotes/origin/updater; then
            git switch -c updater origin/updater
          else
            git switch --orphan updater
          fi
          cp "$RUNNER_TEMP/latest.json" latest.json
          git add latest.json
          if git diff --cached --quiet; then echo "latest.json already offers $TAG"; exit 0; fi
          git commit -q -m "chore(updater): offer $TAG"
          git push origin updater
