name: CI

# Release branches get CI from their pull request, or from release.yml, which starts it on a
# commit that has none (such as the version commit it pushes).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request replaces its running CI. On main and release branches every
# commit keeps its run: a release waits for CI on its exact commit.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # The crates that must build everywhere. islet-desktop needs Tauri's system libraries on
  # Linux, so it is left to the macOS job, whose workspace clippy and tests cover these crates
  # on macOS too.
  portable:
    name: Portable crates (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CRATES: -p islet-protocol -p islet-core -p islet-provider-meet -p islet-provider-demo -p islet-bridge -p islet-native-host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # rustup installs the toolchain pinned in rust-toolchain.toml on first use.
      - run: rustc --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all --check
        if: runner.os == 'Linux'
      - run: cargo clippy ${{ env.CRATES }} --all-targets -- -D warnings
        shell: bash
      - run: cargo test ${{ env.CRATES }}
        shell: bash

  workspace:
    name: Workspace and app (macOS)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions
          cache: pnpm
      - run: rustc --version && rustup target add aarch64-apple-darwin x86_64-apple-darwin
      # Shared with release.yml's build, and saved only from main, whose caches every branch
      # can read.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: macos-app
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: pnpm install --frozen-lockfile
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Generated TypeScript types are up to date
        run: git diff --exit-code -- packages/protocol-ts packages/ui-types
      # The universal app only on main: it checks the bundle and fills the cache release.yml
      # builds with. Pull requests and release branches skip it; a release builds it anyway.
      - run: pnpm --filter @islet/desktop build:app:universal
        if: github.ref == 'refs/heads/main'

  web:
    name: Extension and UI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      # Includes the fixture sanitization test.
      - run: pnpm test
      # Includes the extension's release build check.
      - run: pnpm build
