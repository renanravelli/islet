name: Release

# Pushing a tag v<version> (the app's version, such as v0.1.1) builds the universal DMG, the
# in-app update bundle and the extension zip and attaches them to a draft release, to be
# reviewed and published by hand. Publishing it triggers update-manifest.yml, which offers the
# version to installed apps (ADR 0006). Versions below 1.0 are pre-releases.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # Signing and notarization need all six secrets; without them the app is signed ad hoc.
  SIGNED: ${{ secrets.APPLE_CERTIFICATE != '' }}
  # The in-app updater checks every download against the public key in tauri.conf.json.
  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: The tag matches the app version
        run: |
          version="$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")"
          tag="${GITHUB_REF_NAME#v}"
          # The updater compares versions, so every release needs its own: no suffixes.
          if [[ "$tag" != "$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the app version $version"; exit 1
          fi
          if [[ -z "$TAURI_SIGNING_PRIVATE_KEY" ]]; then
            echo "::error::The TAURI_SIGNING_PRIVATE_KEY secret is missing (ADR 0006)"; exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: pnpm
      - run: rustc --version && rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile

      - name: Build the app (signed and notarized)
        if: env.SIGNED == 'true'
        run: pnpm --filter @islet/desktop build:app:universal --config src-tauri/tauri.updater.json
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      # Ad hoc signing seals the whole bundle, so macOS offers "Open Anyway" instead of calling
      # the downloaded app damaged.
      - name: Build the app (ad hoc signature)
        if: env.SIGNED != 'true'
        run: pnpm --filter @islet/desktop build:app:universal --config src-tauri/tauri.updater.json
        env:
          APPLE_SIGNING_IDENTITY: "-"

      - name: Build the extension
        run: |
          pnpm --filter @islet/extension build
          (cd extension/dist && zip -qr "$GITHUB_WORKSPACE/islet-extension-$VERSION.zip" .)

      - name: Collect the assets
        run: |
          mkdir dist
          bundle=target/universal-apple-darwin/release/bundle
          mv "$bundle/dmg/Islet_${VERSION}_universal.dmg" dist/
          mv "$bundle/macos/Islet.app.tar.gz" "dist/Islet_${VERSION}_universal.app.tar.gz"
          mv "$bundle/macos/Islet.app.tar.gz.sig" "dist/Islet_${VERSION}_universal.app.tar.gz.sig"
          mv "islet-extension-$VERSION.zip" dist/
          (cd dist && shasum -a 256 * > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=(--draft --verify-tag --generate-notes --title "Islet $GITHUB_REF_NAME")
          if [[ "$VERSION" == 0.* ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" "${flags[@]}" dist/*
