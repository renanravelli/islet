[package]
name = "islet-native-host"
description = "Chrome Native Messaging host bridging stdio to the Islet app's local socket."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
islet-bridge.workspace = true
islet-protocol.workspace = true
tokio = { workspace = true, features = ["io-std", "io-util", "macros", "net", "process", "rt", "sync", "time"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["io-util", "macros", "process", "rt", "time"] }
