[package]
name = "islet-desktop"
description = "The Islet desktop app: Tauri shell, island window, tray and bridge server."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "islet_desktop"

[[bin]]
name = "islet"
path = "src/main.rs"

# Not `workspace = true`: this crate allows unsafe code in src/platform/macos.rs only.
# Keep the rest in sync with [workspace.lints] in the root Cargo.toml.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
islet-bridge.workspace = true
islet-core.workspace = true
islet-protocol.workspace = true
islet-provider-demo = { path = "../../../crates/provider-demo" }
islet-provider-meet = { path = "../../../crates/provider-meet" }
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2.12.5", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2.7.0"
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-single-instance = "2.5.5"
tauri-plugin-updater = "2.14.1"
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true
ts-rs.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSScreen", "NSGraphics", "NSAppearance", "NSApplication", "NSResponder", "NSWindow", "NSWorkspace"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSGeometry", "NSLocale", "NSString", "NSThread", "NSURL"] }
tauri-nspanel = "2.1.1"
