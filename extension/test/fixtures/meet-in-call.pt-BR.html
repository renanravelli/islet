<!-- SYNTHETIC FIXTURE: hand-written to match selectors.json; not captured from Google Meet. -->
<!-- No data-is-muted or aria-pressed: the adapter must fall back to the pt-BR aria-labels. -->
<main>
  <div data-participant-id="p1" data-speaking="false">
    <span data-self-name>Alex Exemplo</span>
  </div>
  <div role="toolbar">
    <button aria-label="Ativar microfone (⌘ + d)"></button>
    <button aria-label="Desativar câmera (⌘ + e)"></button>
    <button aria-label="Abaixar a mão (ctrl + ⌘ + h)"></button>
    <button aria-label="Mostrar todos (3)"></button>
    <button aria-label="Sair da chamada"></button>
  </div>
  <div role="alert">Você está falando? Ative o microfone para que os outros ouçam.</div>
</main>
