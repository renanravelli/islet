<!-- SYNTHETIC FIXTURE: hand-written to match selectors.json; not captured from Google Meet. -->
<main>
  <div data-meeting-title>Synthetic design review</div>
  <div data-participant-id="p1" data-speaking="true">
    <span data-self-name>Alex Example</span>
  </div>
  <div data-participant-id="p2" data-speaking="false">
    <span data-self-name>Sam Example</span>
  </div>
  <div role="toolbar">
    <button aria-label="Turn off microphone (⌘ + d)" data-is-muted="false"></button>
    <button aria-label="Turn on camera (⌘ + e)" data-is-muted="true"></button>
    <button aria-label="Raise hand (ctrl + ⌘ + h)" aria-pressed="false"></button>
    <button aria-label="Show everyone"><span>5</span></button>
    <button aria-label="Chat with everyone"></button>
    <button aria-label="Leave call"></button>
  </div>
  <aside aria-label="In-call messages">
    <div data-message-text>Synthetic chat line that must never be read</div>
  </aside>
</main>
